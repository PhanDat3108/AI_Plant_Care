name: infra
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plantcare
      POSTGRES_USER: plant
      POSTGRES_PASSWORD: local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - plant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant -d plantcare"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  plant_data:
